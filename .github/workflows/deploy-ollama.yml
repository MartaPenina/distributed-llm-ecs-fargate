name: Build and Deploy Ollama

# Runs automatically whenever code changes are pushed to main, but only
# if the change touches the Ollama Dockerfile or its build context —
# no point rebuilding the image for unrelated Terraform/docs changes.
on:
  push:
    branches: [main, task3]
    paths:
      - 'docker/ollama-llm/**'

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: ollama-llm
  ECS_CLUSTER: distributed-llm-ecs-fargate-dev-ollama-cluster
  ECS_SERVICE: distributed-llm-ecs-fargate-dev-ollama
  # One model or several, space-separated. This is the ONLY place you need
  # to touch to change which model(s) ship in the image — Dockerfile itself
  # stays generic and never needs editing for a model change.
  MODEL_NAMES: "qwen2.5:3b"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Tagged with the commit SHA — every build is traceable to the exact
      # code that produced it, and never overwrites a previous tag, so
      # rolling back just means pointing the service at an older SHA tag.
      - name: Build and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg MODEL_NAMES="$MODEL_NAMES" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG docker/ollama-llm/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # Pulls the CURRENTLY RUNNING task definition (whatever Terraform last
      # applied), so we only change the image — every other setting (CPU,
      # memory, secrets, health check, EFS mount) stays exactly what
      # Terraform defined. This keeps Terraform as the source of truth for
      # infrastructure, while this pipeline only ever touches the image.
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_SERVICE \
            --query 'taskDefinition' \
            --region $AWS_REGION > task-definition.json

      - name: Render new task definition with updated image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ollama
          image: ${{ steps.build-image.outputs.image }}

      # Registers the new revision and updates the service to use it —
      # this is what actually creates a NEW task definition revision
      # (not just a restart with the old one), and ECS handles the
      # rolling replacement of the running task automatically.
      - name: Deploy new task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true