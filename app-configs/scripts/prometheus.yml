# Prometheus config for ECS Fargate — scrapes Ollama, AnythingLLM, and itself
# directly via Service Connect DNS names, no remote_write/Grafana Agent needed
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "ollama"
    static_configs:
      - targets: ["ollama:11434"]
    metrics_path: /metrics

  - job_name: "anythingllm"
    static_configs:
      - targets: ["anythingllm:3001"]
    metrics_path: /metrics