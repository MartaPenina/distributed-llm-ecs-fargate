services:
  ollama:
    image: ollama/ollama:0.3.6
    container_name: ollama-local-test
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 7g

  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm-local-test
    ports:
      - "3000:3001"
    environment:
      - STORAGE_DIR=/app/server/storage
    volumes:
      - anythingllm_data:/app/server/storage
    depends_on:
      - ollama

volumes:
  ollama_data:
  anythingllm_data: